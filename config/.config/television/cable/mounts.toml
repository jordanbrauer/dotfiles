[metadata]
name = "mounts"
description = "List mounted filesystems"
requirements = ["df", "awk"]

[source]
# POSIX output works on macOS and Linux. Locate the numeric columns so spaces
# in either the filesystem name (e.g. "map auto_home") or mount path survive.
command = '''df -P | awk 'NR > 1 && match($0, /[[:space:]]+[0-9]+[[:space:]]+[0-9]+[[:space:]]+-?[0-9]+[[:space:]]+[0-9]+%[[:space:]]+/) { print substr($0, RSTART + RLENGTH) }' '''

[preview]
command = "df -h '{}' && echo && ls -la '{}' 2>/dev/null | head -20"

[keybindings]
enter = "actions:cd"

[actions.cd]
description = "Open a shell in the selected mount point"
command = "cd '{}' && $SHELL"
mode = "execute"
