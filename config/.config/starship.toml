# Monium — minimal monochrome prompt
# Two-line: info on top, cursor on bottom. Left only.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
\
$cmd_duration\
$status\
$line_break\
$character"""

right_format = ""
add_newline = true

# ── Cursor ──────────────────────────────────────────────────
# Insert = bold dark, Normal = bold gray, Error = bold red
[character]
success_symbol = "[λ](bold #333331)"
error_symbol = "[λ](bold #a93636)"
vimcmd_symbol = "[λ](bold #787876)"

# ── Directory ───────────────────────────────────────────────
# Just the current directory name (basename)
[directory]
format = "[$path]($style)"
style = "bold #333331"
truncate_to_repo = false
truncation_length = 1

# ── Git ─────────────────────────────────────────────────────
[git_branch]
format = " [on](fg:#787876) [$branch $symbol]($style)"
symbol = ""
style = "#5f5f5d"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "#787876"
staged = " "
untracked = " "
modified = " "
deleted = " "
renamed = " "
conflicted = "! "
typechanged = " "
stashed = ""
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"

# [custom.git_dirty]
# command = "printf '\\uf4d2'"
# when = "test -n \"$(git status --porcelain 2>/dev/null)\""
# format = " [$output]($style) "
# style = "#787876"
# detect_folders = [".git"]

[cmd_duration]
format = " [·](fg:#787876) [$duration]($style)"
style = "#787876"
min_time = 2000

# ── Exit Code ───────────────────────────────────────────────
# Shows numeric exit code on failure (λ also turns red)
[status]
format = " [·](fg:#787876) [$status]($style)"
style = "bold #a93636"
symbol = ""
disabled = false
