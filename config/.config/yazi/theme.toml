# general 
[mgr]
syntect_theme = "~/.dotfiles/config/.config/yazi/darkvoid.xml"
marker_copied   = { fg = "#065905", bg = "#065905" }
marker_cut      = { fg = "#a93636", bg = "#a93636" }
marker_marked   = { fg = "#333331", bg = "#333331" }
marker_selected = { fg = "#3388ea", bg = "#3388ea" }

cwd = { fg = "#333331", bold = true }
hovered = { bg = "#333331", bold = true }

tab_active   = { fg = "#3388ea", bold = true, italic = true }
tab_inactive = { fg = "#787876" }
tab_width    = 1

[tabs]

active = { fg = "#bababd", bg="#333331", bold = true }
inactive = { fg = "#333331", bg="#bababd" }
sep_inner = { open = "▐", close = "▌" }
sep_outer = { open = "", close = "" }

count_copied   = { fg = "#065905", reversed = true }
count_cut      = { fg = "#a93636", reversed = true }
count_selected = { fg = "#3388ea", reversed = true }

border_symbol = "│"
border_style = { fg = "#333331"}
title_format = ""

[indicator]
current = { bg = "#3388ea", fg = "#fffffd" }  # cursor blue highlight
padding = { open = "▐", close = "▌" }
preview = { reversed = false }

# status-line
[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
separator_style = { fg = "reset" } # light bg

perm_type = { fg = "#333331" }
perm_read = { fg = "#333331" }
perm_write = { fg = "#333331" }
perm_exec = { fg = "#3388ea" }
perm_sep = { fg = "#787876" }

progress_label  = { fg = "#fffffd", bg = "#333331", bold = true }
progress_normal = { fg = "#333331", bg = "#bababd" }
progress_error  = { fg = "#a93636", bg = "#bababd" }

[mode]
normal_main = { fg = "#fffffd", bg = "#333331" }
normal_alt = { fg = "#fffffd", bg = "#333331" }

# Select mode — cursor blue highlight (matches fzf bg+)
select_main = { fg = "#fffffd", bg = "#3388ea" }
select_alt = { fg = "#3388ea", bg = "#333331" }

# Unset mode
unset_main = { fg = "#fffffd", bg = "#787876" }
unset_alt = { fg = "#787876", bg = "#333331" }

[select]
border   = { fg = "#3388ea" }
active   = { fg = "#000000", bold = true }
inactive = {}

[input]
border   = { fg = "#333331" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#3388ea" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#3388ea" }
title   = {}
hovered = { fg = "#000000", bold = true }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#787876" }
mask = { bg = "#afafaf" }
rest = { fg = "#787876" }
cand = { fg = "#333331" }
desc = { fg = "#5f5f5d" }

[help]
on      = { fg = "#3388ea" }
run     = { fg = "#000000" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#fffffd", bg = "#333331" }

[notify]
title_info  = { fg = "#065905" }
title_warn  = { fg = "#dcdc60" }
title_error = { fg = "#a93636" }

# files
[filetype]
rules = [
    { mime = "image/*", fg = "#66b2b2" },
    { mime = "{audio,video}/*", fg = "#66b2b2" },
    { mime = "application/{,g}zip", fg = "#e1e1e1" },
    { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#e46876" },
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "yellow" },
    { url = "*", is = "link", fg = "#6666aa" },
    { url = "*/", is = "link", fg = "#6666aa" },
    { url = "*", is = "orphan", fg = "#cc0000" },
    { url = "*/", fg = "#000000"},
    { url = "*", fg = "#000000"},
]

[icon]

# using nf-md-file-*
#       nf-oct-*    (also seems to work okay)

globs = [
