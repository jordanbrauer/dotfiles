[flags]

battery = true
tree = true

[styles]

[styles.tables]
headers = {color = "#333331", bold = true}

[styles.graphs]
graph_color = "#787876"
legend_text = {color = "#787876"}

[styles.widgets]
border_color = "#5f5f5d"
selected_border_color = "#3388ea"
widget_title = {color = "#000000"}
text = {color = "#333331"}
selected_text = {color = "#fffffd", bg_color = "#3388ea"}
disabled_text = {color = "#a1a1a1"}

[styles.memory]
ram_color = "#3388ea"
swap_color = "#6666aa"
cache_color = "#a93636"

[styles.network]
rx_color = "#3388ea"
tx_color = "#6666aa"

[[row]]
  ratio=2
  [[row.child]]
    ratio=3
    type="proc"
  [[row.child]]
    ratio=4
    [[row.child.child]]
      type="cpu"
    [[row.child.child]]
      type="mem"
    [[row.child.child]]
      type="net"
    [[row.child]]
      ratio=2
      [[row.child.child]]
        type="batt"
      [[row.child.child]]
        type="temp"
      [[row.child.child]]
        type="disk"
